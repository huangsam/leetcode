name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# For programming language versions supported by Leetcode
# https://support.leetcode.com/hc/en-us/articles/360011833974-What-are-the-environments-for-the-programming-languages
jobs:
  python-build:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Setup latest version of uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Run lint
        run: uv run --locked ruff check python
      - name: Run type hints
        run: uv run --locked mypy python

  java-build:
    name: Java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'gradle'
      - name: Build source with Gradle
        run: |
          ./gradlew build
